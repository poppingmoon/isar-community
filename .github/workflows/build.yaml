name: Build

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            os: android
            architecture: arm
            target-triple: armv7-linux-androideabi
          - runner: ubuntu-latest
            os: android
            architecture: arm64
            target-triple: aarch64-linux-android
          - runner: ubuntu-latest
            os: android
            architecture: x64
            target-triple: x86_64-linux-android
          - runner: ubuntu-latest
            os: linux
            architecture: x64
            target-triple: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            os: linux
            architecture: arm64
            target-triple: aarch64-unknown-linux-gnu
          - runner: windows-latest
            os: windows
            architecture: arm64
            target-triple: aarch64-pc-windows-msvc
          - runner: windows-latest
            os: windows
            architecture: x64
            target-triple: x86_64-pc-windows-msvc
      fail-fast: false

    env:
      ANDROID_TARGET_NDK_API: 24
      NDK_VERSION: 28.2.13676358

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1.8.2

      - name: Get dependencies
        working-directory: packages/isar_community
        run: dart pub get

      - name: Get compiler path
        id: get-compiler-path
        if: matrix.os == 'android'
        working-directory: packages/isar_community
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;${{ env.NDK_VERSION }}"
          NDK=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}
          COMPILER_DIR=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          echo archiver=$COMPILER_DIR/llvm-ar >> $GITHUB_OUTPUT
          case ${{ matrix.architecture }} in
            arm) echo compiler=$COMPILER_DIR/armv7a-linux-androideabi21-clang >> $GITHUB_OUTPUT;;
            arm64) echo compiler=$COMPILER_DIR/aarch64-linux-android21-clang >> $GITHUB_OUTPUT;;
            x64) echo compiler=$COMPILER_DIR/x86_64-linux-android21-clang >> $GITHUB_OUTPUT;;
          esac
          echo linker=$COMPILER_DIR/lld >> $GITHUB_OUTPUT

      - name: Allow long path
        if: matrix.runner == 'windows-latest'
        run: git config --global core.longpaths true

      - name: Build
        working-directory: packages/isar_community
        run: >
          dart tool/build.dart
          --os ${{ matrix.os }}
          --architecture ${{ matrix.architecture }}
          ${{ case(matrix.os == 'android', format('--android-target-ndk-api {0}', env.ANDROID_TARGET_NDK_API), '') }}
          ${{ case(matrix.os == 'android', format('--archiver {0}', steps.get-compiler-path.outputs.archiver), '') }}
          ${{ case(matrix.os == 'android', format('--compiler {0}', steps.get-compiler-path.outputs.compiler), '') }}
          ${{ case(matrix.os == 'android', format('--linker {0}', steps.get-compiler-path.outputs.linker), '') }}
          --add-target-triple

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          path: |
            packages/isar_community/.dart_tool/isar_community/**/target/${{ matrix.target-triple }}/release/*.dll
            packages/isar_community/.dart_tool/isar_community/**/target/${{ matrix.target-triple }}/release/*.so
          archive: false

  build-macos:
    runs-on: macos-latest

    permissions:
      contents: write

    env:
      IOS_TARGET_VERSION: 13
      IPHONEOS_DEPLOYMENT_TARGET: 13.0
      MACOS_TARGET_VERSION: 11

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1.8.2

      - name: Get dependencies
        working-directory: packages/isar_community
        run: dart pub get

      - parallel:
        - name: Build
          working-directory: packages/isar_community
          run: >
            dart tool/build.dart
            --os macos
            --architecture arm64
            --macos-target-version ${{ env.MACOS_TARGET_VERSION }}
            --add-target-triple

        - name: Build aarch64-apple-darwin
          working-directory: packages/isar_community
          run: >
            dart tool/build.dart
            --os macos
            --architecture arm64
            --macos-target-version ${{ env.MACOS_TARGET_VERSION }}
            --add-target-triple

        - name: Build x86_64-apple-darwin
          working-directory: packages/isar_community
          run: >
            dart tool/build.dart
            --os macos
            --architecture x64
            --macos-target-version ${{ env.MACOS_TARGET_VERSION }}
            --add-target-triple

        - name: Build aarch64-apple-ios
          working-directory: packages/isar_community
          run: >
            dart tool/build.dart
            --os ios
            --architecture arm64
            --ios-sdk iphoneos
            --ios-target-version ${{ env.IOS_TARGET_VERSION }}
            --add-target-triple

        - name: Build aarch64-apple-ios-sim
          working-directory: packages/isar_community
          run: >
            dart tool/build.dart
            --os ios
            --architecture arm64
            --ios-sdk iphonesimulator
            --ios-target-version ${{ env.IOS_TARGET_VERSION }}
            --add-target-triple

        - name: Build x86_64-apple-ios
          working-directory: packages/isar_community
          run: >
            dart tool/build.dart
            --os ios
            --architecture x64
            --ios-sdk iphonesimulator
            --ios-target-version ${{ env.IOS_TARGET_VERSION }}
            --add-target-triple

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          path: |
            packages/isar_community/.dart_tool/isar_community/**/target/aarch64-apple-darwin/release/*.dylib
            packages/isar_community/.dart_tool/isar_community/**/target/x86_64-apple-darwin/release/*.dylib
            packages/isar_community/.dart_tool/isar_community/**/target/aarch64-apple-ios/release/*.dylib
            packages/isar_community/.dart_tool/isar_community/**/target/aarch64-apple-ios-sim/release/*.dylib
            packages/isar_community/.dart_tool/isar_community/**/target/x86_64-apple-ios/release/*.dylib
          archive: false

  release:
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/v')

    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2

      - name: Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: '**'
