name: isar_community
description: Extremely fast, easy to use, and fully async NoSQL database for Flutter.
version: 3.3.2
repository: https://github.com/isar-community/isar-community
homepage: https://github.com/isar-community/isar-community
issue_tracker: https://github.com/isar-community/isar-community/issues
documentation: https://isar-community.dev
funding:
  - https://github.com/sponsors/vicenterusso/

environment:
  sdk: ">=3.10.0 <4.0.0"

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  code_assets: ^1.0.0
  crypto: ^3.0.7
  ffi: ">=2.0.0 <3.0.0"
  hooks: ^1.0.2
  js: any
  # meta: ^1.7.0
  native_toolchain_rust: ^1.0.3

dev_dependencies:
  args: ^2.7.0
  ffigen: ^20.1.1
  test: any
  very_good_analysis: ^3.0.1
