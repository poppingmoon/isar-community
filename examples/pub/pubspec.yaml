name: pub_app
description: A new Flutter project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  auto_size_text: ^3.0.0
  clickup_fading_scroll:
    git:
      url: https://github.com/clickup/clickup_fading_scroll.git
  dio: ^5.9.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  google_fonts: ^7.0.2
  isar_community: ^3.3.0
  json_serializable: ^6.11.2
  json_annotation: ^4.9.0
  markdown: ^7.3.0
  path_provider: ^2.1.5
  pub_semver: ^2.2.0
  pubspec: ^2.3.0
  pubspec_parse: ^1.5.0
  riverpod: ^3.1.0
  shimmer: ^3.0.0
  tar: ^2.0.2
  timeago: ^3.7.1
  url_launcher: ^6.3.2
  go_router: ^17.0.1
  flutter_svg: ^2.2.3
  flutter_html: ^3.0.0
  flutter_html_svg: ^3.0.0

dev_dependencies:
  build_runner: ^2.10.5
  flutter_test:
    sdk: flutter
  isar_community_generator: ^3.3.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ff_banner.png
    - assets/pub_logo.svg
    - assets/pub_logo_dark.svg
    - assets/search_bg.svg

dependency_overrides:
  isar_community:
    path: ../../packages/isar_community

  # dev
  isar_community_generator:
    path: ../../packages/isar_community_generator

hooks:
  user_defines:
    isar_community:
      local_build: false
